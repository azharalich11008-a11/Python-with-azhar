<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python With Azhar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            background: #111827;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #facc15;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #facc15;
        }

        /* HERO */
        .hero {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
        }

        .hero-content {
            max-width: 850px;
        }

        .python-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #facc15;
        }

        .hero p {
            font-size: 19px;
            line-height: 1.7;
            color: #e5e7eb;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #facc15;
            color: #111827;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #fde047;
        }

        /* SECTIONS */
        section {
            padding: 75px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 35px;
            margin-bottom: 15px;
            color: #111827;
        }

        .section-text {
            text-align: center;
            max-width: 700px;
            margin: auto;
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 45px;
        }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 12px;
            color: #111827;
        }

        .card p {
            color: #6b7280;
            line-height: 1.6;
        }

        /* COURSE */
        .course-box {
            max-width: 900px;
            margin: auto;
            background: #111827;
            color: white;
            padding: 40px;
            border-radius: 20px;
        }

        .course-box h3 {
            color: #facc15;
            font-size: 25px;
            margin-bottom: 20px;
        }

        .course-list {
            list-style: none;
        }

        .course-list li {
            padding: 12px 0;
            border-bottom: 1px solid #374151;
        }

        /* NOTES */
        .notes {
            background: #f8fafc;
        }

        .notes-container {
            max-width: 1050px;
            margin: auto;
        }

        .note-card {
            background: white;
            margin-bottom: 18px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        .note-card summary {
            cursor: pointer;
            padding: 20px 24px;
            font-size: 19px;
            font-weight: bold;
            color: #111827;
            list-style: none;
        }

        .note-card summary::-webkit-details-marker {
            display: none;
        }

        .note-card summary::after {
            content: "＋";
            float: right;
            color: #2563eb;
        }

        .note-card[open] summary::after {
            content: "−";
        }

        .note-content {
            padding: 0 24px 24px;
            color: #4b5563;
            line-height: 1.7;
        }

        .note-content h4 {
            color: #111827;
            margin: 18px 0 8px;
        }

        .code {
            background: #111827;
            color: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }

        .note-content ul,
        .note-content ol {
            padding-left: 25px;
        }

        .note-content li {
            margin: 6px 0;
        }

        .mcq {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        /* REGISTRATION */
        .register {
            background: #eef2ff;
        }

        .form-box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .success-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        /* FOOTER */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        footer span {
            color: #facc15;
        }

        @media (max-width: 800px) {

            nav {
                padding: 15px 5%;
            }

            nav
